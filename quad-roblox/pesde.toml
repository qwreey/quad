name = "qwreey/quad_roblox"
version = "0.0.0"
description = "quad — Roblox 백엔드: quad-base의 pluggable 인터페이스를 실제로 구현"
includes = ["src/*"]

[target]
environment = "roblox"
build_files = ["src"]
lib = "src/init.luau"

[dependencies]
quad_types = { workspace = "qwreey/quad_types", version = "^", target = "luau" }

# round14 Q3 (a) — 런타임은 직접 주입이라 quad_base가 필요 없고(타입만),
# spec/테스트만 quad_base를 쓴다. dev deps는 소비자에게 전파되지 않는다 —
# 루트 pesde.toml이 wally→pesde 전환 사유로 적어둔 바로 그 기능.
[dev_dependencies]
quad_base = { workspace = "qwreey/quad_base", version = "^", target = "luau" }
