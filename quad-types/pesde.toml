name = "qwreey/quad_types"
version = "3.1.0"
description = "quad — public type contract (no implementation) plus the version-compatibility type function; backends and plugins depend on this instead of quad-base"
includes = ["src/**", "README.md", "LICENSE", "pesde.toml"]
license = "MIT"
authors = ["qwreey <me@qwreey.moe>"]
repository = "https://github.com/qwreey/quad"

[indices]
default = "https://github.com/pesde-pkg/index"

[target]
environment = "luau"
lib = "src/init.luau"

[dependencies]
type_version_check = { workspace = "qwreey/type_version_check", version = "^" }
quad_error = { workspace = "qwreey/quad_error", version = "^" }
