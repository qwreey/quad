# Rokit-관리 툴체인. `vide`(`.claude/initreq/vide/rokit.toml`) 선례를 따르되
# wally 항목은 뺌(pesde로 전환, 2026-08-19 사용자 결정).
#
# [2026-08-19] pesde/rojo/luau-lsp 셋 다 이 핀 그대로 `/code/.local/bin`에
# 직접 설치해 버전 일치까지 실측 확인 완료(`rokit` 자체는 이 샌드박스에
# 없어 `rokit install`로 검증한 건 아님 — 바이너리를 개별 다운로드해
# 대조). 상세는 `.claude/base/project-setup-plan.md`.
[tools]
pesde = "pesde-pkg/pesde@0.7.3+registry.0.2.3"
rojo = "rojo-rbx/rojo@7.7.0"
