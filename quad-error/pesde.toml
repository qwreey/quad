name = "qwreey/quad_error"
version = "3.0.0"
description = "Level-tagged error utility: tag functions with setFuncLevel and let errorAt/errorBefore blame the right caller frame (engine-agnostic, not quad-specific)"
includes = ["src/**", "README.md", "LICENSE", "pesde.toml"]
license = "MIT"
authors = ["qwreey <me@qwreey.moe>"]
repository = "https://github.com/qwreey/quad"

[indices]
default = "https://github.com/pesde-pkg/index"

[target]
environment = "luau"
lib = "src/init.luau"
