name = "qwreey/type_version_check"
version = "3.0.0"
description = "Compile-time version pattern matching for string literal types: glob (*) and caret (N^) patterns with SemVer prerelease/build tails (engine-agnostic, not quad-specific)"
includes = ["src/**", "README.md", "LICENSE", "pesde.toml"]
license = "MIT"
authors = ["qwreey <me@qwreey.moe>"]
repository = "https://github.com/qwreey/quad"

[indices]
default = "https://github.com/pesde-pkg/index"

[target]
environment = "luau"
lib = "src/init.luau"
