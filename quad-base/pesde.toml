name = "qwreey/quad_base"
version = "3.4.0"
description = "quad — engine-agnostic core of the DOMless UI renderer: Store/State/Source reactivity and a pluggable dispatch engine"
includes = ["src/**", "README.md", "LICENSE", "pesde.toml"]
license = "MIT"
authors = ["qwreey <me@qwreey.moe>"]
repository = "https://github.com/qwreey/quad"

[indices]
default = "https://github.com/pesde-pkg/index"

[target]
environment = "luau"
lib = "src/init.luau"

[dependencies]
quad_types = { workspace = "qwreey/quad_types", version = "^" }
quad_error = { workspace = "qwreey/quad_error", version = "^" }
# [2026-10-22 user decision] AssertProvider matches the provider's declared version with the same pattern
# grammar quad-roblox already uses (small, engine-agnostic, types-family like quad_types)
type_version_check = { workspace = "qwreey/type_version_check", version = "^" }
